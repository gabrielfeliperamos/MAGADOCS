<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGADOCs - Manifestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1a281f 0%, #050706 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
        }
    </style>
</head>
<body class="p-6 md:p-10 font-sans">

    <!-- Cabeçalho -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
        <div class="flex items-center gap-4">
            <div class="text-3xl font-black tracking-widest text-white">
                MAGA<span class="text-[#8cd9a4]">DOCs</span>
            </div>
        </div>
        
        <div class="w-full md:w-64">
            <label class="block text-xs text-[#8c9c91] mb-1 font-semibold uppercase tracking-wider">Unidade</label>
            <select class="w-full bg-[#111312] border border-[#2a302c] text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#4a5a50] appearance-none">
                <option>São Paulo - Matriz</option>
                <option>Rio de Janeiro</option>
                <option>Minas Gerais</option>
            </select>
        </div>
    </header>

    <!-- Barra de Busca -->
    <main class="max-w-4xl mx-auto">
        <div class="mb-10">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg class="w-5 h-5 text-[#8c9c91]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="campoBusca" onkeyup="filtrarManifestos()" placeholder="Procurar por ID da viagem, destino ou status..." class="w-full bg-[#111312] border border-[#2a302c] text-white text-base rounded-xl block pl-12 pr-4 py-4 focus:outline-none focus:border-[#8cd9a4] focus:ring-1 focus:ring-[#8cd9a4] transition-all placeholder-[#4a5a50]">
            </div>
        </div>

        <!-- Grelha de Manifestos -->
        <div id="manifestos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-[#8c9c91] text-center col-span-full py-10">A carregar manifestos...</p>
        </div>
    </main>

    <script>
        // COLOQUE AQUI O URL GERADO NO GOOGLE APPS SCRIPT
        const API_URL = 'COLE_AQUI_O_SEU_URL_DO_APPS_SCRIPT';

        async function getManifestos() {
            const container = document.getElementById('manifestos-container');
            
            try {
                const resposta = await fetch(API_URL);
                if (!resposta.ok) throw new Error("Erro na rede.");
                
                // O Apps Script já devolve o JSON perfeitamente formatado
                const dados = await resposta.json();
                
                container.innerHTML = '';

                if (dados.length === 0) {
                    container.innerHTML = '<p class="text-[#8c9c91] text-center col-span-full py-10">Nenhum registo encontrado na folha de cálculo.</p>';
                    return;
                }

                dados.forEach(manifesto => {
                    const status = manifesto.status;
                    let corStatus = 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20';
                    let bolinhaStatus = 'bg-yellow-500';
                    
                    if(status.toLowerCase().includes('concluído')) {
                        corStatus = 'bg-green-500/10 text-green-500 border border-green-500/20'; 
                        bolinhaStatus = 'bg-green-500';
                    } else if (status.toLowerCase().includes('trânsito')) {
                        corStatus = 'bg-blue-500/10 text-blue-500 border border-blue-500/20'; 
                        bolinhaStatus = 'bg-blue-500';
                    }

                    const cardHTML = `
                        <div class="bg-[#111312] border border-[#2a302c] rounded-xl p-5 flex flex-col justify-between hover:border-[#4a5a50] transition-colors manifesto-card" data-id="${manifesto.id.toLowerCase()}" data-status="${status.toLowerCase()}" data-trajeto="${manifesto.trajeto.toLowerCase()}">
                            <div>
                                <div class="flex justify-between items-start mb-4 gap-2">
                                    <div>
                                        <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1">ID DA VIAGEM</p>
                                        <h3 class="text-xl text-gray-100 font-bold tracking-wider">#${manifesto.id}</h3>
                                    </div>
                                    <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${corStatus}">
                                        <span class="w-1.5 h-1.5 rounded-full ${bolinhaStatus}"></span>
                                        ${status}
                                    </span>
                                </div>
                                <div class="mb-4">
                                    <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1">ROTA</p>
                                    <p class="text-sm text-gray-300 font-medium">${manifesto.trajeto}</p>
                                </div>
                            </div>
                            
                            <button onclick="abrirLink('${manifesto.link}')" class="w-full mt-2 flex items-center justify-center gap-2 bg-[#263b2c] hover:bg-[#2d4734] text-[#8cd9a4] py-3 rounded-lg text-xs font-bold tracking-wider transition-colors border border-[#36523e]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                BAIXAR MDF-E
                            </button>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });

            } catch (erro) {
                container.innerHTML = `<p class="text-red-400 text-center col-span-full py-10">Erro de ligação. Verifique se o URL da API está correto.</p>`;
            }
        }

        function abrirLink(url) {
            if (!url || url === 'undefined' || url === '') {
                alert("Nenhum link de MDF-e cadastrado para esta viagem.");
                return;
            }
            window.open(url, '_blank');
        }

        function filtrarManifestos() {
            const textoBusca = document.getElementById('campoBusca').value.toLowerCase();
            const cards = document.querySelectorAll('.manifesto-card');

            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const status = card.getAttribute('data-status');
                const trajeto = card.getAttribute('data-trajeto');

                if (id.includes(textoBusca) || status.includes(textoBusca) || trajeto.includes(textoBusca)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = getManifestos;
    </script>
</body>
</html>
