    <script>
        // ⚠️ ATENÇÃO: COLOQUE AQUI O LINK DO GOOGLE SHEETS "PUBLICAR NA WEB" EM FORMATO CSV
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTx2xC-461BhCmjZSG5gQuEvKV7R4f706RLw40QErL5kvQSsJhhEc0MgHVxA_4Rb4e2hxOnGfPfLSYV/pub?output=csv';
 
        async function getManifestos() {
            const container = document.getElementById('manifestos-container');
            
            try {
                const urlSemCache = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                
                const resposta = await fetch(urlSemCache);
                if (!resposta.ok) throw new Error("Não foi possível aceder ao link da planilha.");
                
                const textoCSV = await resposta.text();
                
                // SISTEMA DE SEGURANÇA: Bloqueia HTML se o link estiver errado
                if (textoCSV.trim().toLowerCase().startsWith('<!doctype') || textoCSV.trim().toLowerCase().startsWith('<html')) {
                    throw new Error("O link colocado não é um CSV válido. Certifique-se de que usou a opção 'Publicar na Web' e selecionou '.csv'.");
                }
 
                const dados = lerCSV(textoCSV);
                container.innerHTML = '';
 
                if (dados.length === 0) {
                    container.innerHTML = '<p class="text-[#8c9c91] text-center col-span-full py-10">Nenhum registo encontrado na planilha.</p>';
                    return;
                }
 
                dados.slice(-50).reverse().forEach(manifesto => {
                    const idLimpo = manifesto.id.replace(/\.pdf$/i, '').trim();
                    
                    const cardHTML = `
                        <div class="bg-[#111613] border border-[#2a332d] rounded-xl p-5 flex flex-col justify-between hover:border-[#4a5a50] transition-colors manifesto-card shadow-lg" data-id="${idLimpo.toLowerCase()}" data-trajeto="${manifesto.trajeto.toLowerCase()}">
                            <div>
                                <div class="mb-4">
                                    <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1 uppercase">ID da Viagem</p>
                                    <h3 class="text-xl text-gray-100 font-bold tracking-wider">#${idLimpo}</h3>
                                </div>
                                <div class="mb-4">
                                    <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1 uppercase">Rota</p>
                                    <p class="text-sm text-gray-300 font-medium truncate">${manifesto.trajeto}</p>
                                </div>
                            </div>
                            
                            <button onclick="abrirLink('${manifesto.link}')" class="w-full mt-2 flex items-center justify-center gap-2 bg-[#1a2b20] hover:bg-[#263e2e] text-[#8cd9a4] py-3 rounded-lg text-xs font-bold tracking-wider transition-colors border border-[#2a4533]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                BAIXAR MDF-E
                            </button>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
 
            } catch (erro) {
                container.innerHTML = `<p class="text-red-400 text-center col-span-full py-10 font-bold">${erro.message}</p>`;
                console.error(erro);
            }
        }
 
        function lerCSV(textoCSV) {
            const linhas = textoCSV.split('\n');
            const manifestosEncontrados = [];
            
            for (let i = 1; i < linhas.length; i++) {
                if (!linhas[i].trim()) continue;
                
                const colunas = linhas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const formatar = (c) => c ? c.replace(/(^"|"$)/g, '').trim() : "";
                
                const idViagem = formatar(colunas[2]); 
                
                if (idViagem) {
                    const origem = formatar(colunas[6]) || "Origem";
                    const destino = formatar(colunas[7]) || "Destino";
                    const link = formatar(colunas[3]);
                    
                    manifestosEncontrados.push({
                        id: idViagem,
                        trajeto: `${origem} x ${destino}`,
                        link: link
                    });
                }
            }
            return manifestosEncontrados;
        }
 
        function abrirLink(url) {
            if (!url || url === 'undefined' || url === '') {
                alert("Nenhum link de MDF-e cadastrado para esta viagem.");
                return;
            }
            window.open(url, '_blank');
        }
 
        function filtrarManifestos() {
            const textoBusca = document.getElementById('campoBusca').value.toLowerCase();
            const cards = document.querySelectorAll('.manifesto-card');
 
            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const trajeto = card.getAttribute('data-trajeto');
 
                if (id.includes(textoBusca) || trajeto.includes(textoBusca)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
 
        window.onload = getManifestos;
        setInterval(getManifestos, 10000);
    </script>
</body>
</html>
