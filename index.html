<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGADOCs - Manifestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0b0e0c;
            min-height: 100vh;
            color: #ffffff;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
    </style>
</head>
<body class="p-6 md:p-10 max-w-6xl mx-auto">

    <!-- CABEÇALHO (Apenas Logo oficial e Título, sem Unidade) -->
    <header class="flex items-center gap-4 mb-12">
        <!-- LOGO OFICIAL EM CONVERSÃO DE IMAGEM DIRETA -->
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQCAYAAADnRuK4AAAACXBIWXMAAAsTAAALEwEAmpwYAAAFmGlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAMHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyIgeDp4bXB0az0iWE1QIENvcmUgNi4wLjAiPgogICA8cmRmOlJERiB4bWxuczpydWY9Imh0dHA6Ly9ucy5hZG9iZS5jb20vYWRvYmUvcmVzb3VyY2UtdXBkYXRlLWZvcm1hdC8xLjAvIiB4bWxuczp4bXA9Imh0dHA6Ly9ucy5hZG9iZS5jb20veGFwLzEuMC8iIHhtbG5zOmRjPSJodHRwOi8vcHVybC5vcmcvZGMvZWxlbWVudHMvMS4xLyI+CiAgICAgIDxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PSIiPgogICAgICAgICA8eG1wOkNyZWF0b3JUb29sPkFkb2JlIElsbHVzdHJhdG9yPC94bXA6Q3JlYXRvclRvb2w+CiAgICAgIDwvcmRmOkRlc2NyaXB0aW9uPgogICA8L3JkZjpSREY+CjwvcG90bzg+CiAgICAgIDxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PSIgdD0iaW1hZ2UiIj4KIDY0NiwxMiBMIDgwMCw0NSBMIDgwMCw4NTQgTCA2NDYsODg3IFoiIGZpbGw9IiMwYjBkMGMiLz4KICAgICAgPC9yZGY6RGVzY3JpcHRpb24+CiAgIDwvcmRmOlJERj4KPC94bXA+CiAgICA8L3N2Zz4" alt="MAGADOCs Logo" class="w-14 h-14 rounded-2xl shadow-lg border border-[#2a302c] object-cover bg-[#0b0e0c]" onerror="this.onerror=null; this.src='https://i.imgur.com/8Ndf1p8.png'">
        
        <h1 class="text-3xl font-black tracking-widest text-white uppercase">
            MAGA<span class="text-[#8cd9a4]">DOCs</span>
        </h1>
    </header>

    <!-- BUSCA CENTRALIZADA -->
    <main>
        <div class="mb-10">
            <div class="relative max-w-3xl mx-auto">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <svg class="w-5 h-5 text-[#8c9c91]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="campoBusca" onkeyup="filtrarManifestos()" placeholder="Procurar por ID da viagem ou rota..." class="w-full bg-[#111613] border border-[#2a332d] text-white text-base rounded-xl block pl-12 pr-4 py-4 focus:outline-none focus:border-[#8cd9a4] focus:ring-1 focus:ring-[#8cd9a4] transition-all">
            </div>
        </div>

        <!-- CARDS -->
        <div id="manifestos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto">
            <div class="col-span-full flex flex-col items-center justify-center py-10">
                <svg class="animate-spin h-8 w-8 text-[#8cd9a4] mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-[#8c9c91] text-center">Buscando dados ao vivo...</p>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '/api/manifestos'; 

        async function getManifestos() {
            const container = document.getElementById('manifestos-container');
            try {
                const resposta = await fetch(API_URL);
                if (!resposta.ok) throw new Error("Erro na comunicação com a API.");
                
                const dados = await resposta.json();
                container.innerHTML = '';

                if (!Array.isArray(dados) || dados.length === 0) {
                    container.innerHTML = '<p class="text-[#8c9c91] text-center col-span-full py-10">Nenhum registro encontrado.</p>';
                    return;
                }

                dados.slice(-50).reverse().forEach(manifesto => {
                    // LIMPEZA: Remove o texto ".pdf" do ID para ficar limpo
                    const idLimpo = manifesto.id.replace(/\.pdf$/i, '').trim();
                    
                    const cardHTML = `
                        <div class="bg-[#111613] border border-[#2a332d] rounded-xl p-5 flex flex-col justify-between hover:border-[#4a5a50] transition-colors manifesto-card shadow-lg" data-id="${idLimpo.toLowerCase()}" data-trajeto="${manifesto.trajeto.toLowerCase()}">
                            <div>
                                <div class="mb-4">
                                    <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1 uppercase">ID da Viagem</p>
                                    <h3 class="text-xl text-gray-100 font-bold tracking-wider">#${idLimpo}</h3>
                                </div>
                                <div class="mb-4">
                                    <p class="text-[10px] text-[#8c9c91] font-bold tracking-widest mb-1 uppercase">Rota</p>
                                    <p class="text-sm text-gray-300 font-medium truncate">${manifesto.trajeto}</p>
                                </div>
                            </div>
                            <button onclick="abrirLink('${manifesto.link}')" class="w-full mt-2 flex items-center justify-center gap-2 bg-[#1a2b20] hover:bg-[#263e2e] text-[#8cd9a4] py-3 rounded-lg text-xs font-bold tracking-wider transition-colors border border-[#2a4533]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                BAIXAR MDF-E
                            </button>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (erro) {
                container.innerHTML = `<p class="text-red-400 text-center col-span-full py-10 font-bold">${erro.message}</p>`;
            }
        }

        function abrirLink(url) {
            if (!url || url === 'undefined' || url === '') {
                alert("Nenhum link de MDF-e cadastrado para esta viagem.");
                return;
            }
            window.open(url, '_blank');
        }

        function filtrarManifestos() {
            const textoBusca = document.getElementById('campoBusca').value.toLowerCase();
            const cards = document.querySelectorAll('.manifesto-card');

            cards.forEach(card => {
                const id = card.getAttribute('data-id');
                const trajeto = card.getAttribute('data-trajeto');

                if (id.includes(textoBusca) || trajeto.includes(textoBusca)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = getManifestos;
        
        // Atualiza de 5 em 5 segundos sem perder o foco
        setInterval(getManifestos, 5000);
    </script>
</body>
</html>
